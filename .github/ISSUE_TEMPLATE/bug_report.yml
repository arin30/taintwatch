name: Bug Report
description: Create a report to help us improve TaintWatch
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug in TaintWatch!
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps or Python code to reproduce the behavior.
      placeholder: |
        1. Run guard with policy ...
        2. Ingest payload ...
        3. Observe error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Python version, OS, TaintWatch version.
      placeholder: Python 3.12, Ubuntu 24.04, taintwatch 0.1.0
