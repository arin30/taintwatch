name: Feature Request
description: Suggest an idea or enhancement for TaintWatch
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Have an idea to make LLM agent security stronger or faster? We'd love to hear it!
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or security vector?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see implemented.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered.
