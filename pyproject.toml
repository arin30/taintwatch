[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taintwatch"
version = "0.1.0"
description = "Enterprise runtime information-flow control, taint tracking, and covert-channel defense for LLM agents"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "TaintWatch Authors", email = "maintainers@taintwatch.org" }
]
keywords = [
    "llm-security",
    "information-flow-control",
    "taint-tracking",
    "ai-guardrails",
    "prompt-injection-defense",
    "mcp-security",
    "model-context-protocol",
    "zero-trust-ai",
    "langchain",
    "crewai",
    "autogen",
    "cybersecurity",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
taintwatch = "taintwatch.cli.__main__:main"

[project.urls]
Homepage = "https://github.com/eyadstein/taintwatch"
Documentation = "https://github.com/eyadstein/taintwatch#readme"
Repository = "https://github.com/eyadstein/taintwatch.git"
Issues = "https://github.com/eyadstein/taintwatch/issues"
Changelog = "https://github.com/eyadstein/taintwatch/releases"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]
server = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
notebooks = ["jupyterlab>=4.1", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"
